name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go test ./...
        working-directory: examples/minimal-plugin
      - run: go vet ./...
        working-directory: examples/minimal-plugin
      - run: go build ./cmd/plugin
        working-directory: examples/minimal-plugin
